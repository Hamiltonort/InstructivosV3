<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Capacitación de Operarios</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="styesheet" href="css/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- Logo / Nombre de aplicación -->
            <div class="logo">
                CAPACITACIÓN
            </div>

            <!-- Título -->
            <h1>Bienvenido</h1>

            <p class="login-description">
                Ingresa tus datos para acceder a las
                capacitaciones de planta.
            </p>


            <!-- Formulario -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="documento">
                        Documento
                    </label>

                    <input
                        id="documento"
                        name="documento"
                        type="text"
                        placeholder="Ingresa tu documento"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Mensaje de error -->
                <div
                    id="error"
                    class="error"
                    role="alert"
                ></div>


                <!-- Botón -->
                <button
                    class="login-button"
                    type="submit"
                >
                    Ingresar
                </button>

            </form>


            <!-- Información inferior -->
            <div class="login-footer">

                <p>
                    Sistema Local de Capacitación
                </p>

                <span>
                    Operarios de Planta
                </span>

            </div>

        </section>

    </main>


    <!--
        IMPORTANTE:
        storage.js debe cargarse primero.
        Después cargamos login.js.
    -->

    js/storage.jsscript>
    js/login.jsscript>

</body>

</html>
